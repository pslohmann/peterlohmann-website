<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360">
<title>Triple tie-out</title>
<desc>Three numbers must match each month: the bank statement balance, the software bank balance, and the sum of property balances.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d78a7"/></marker></defs>
<rect x="10" y="20" width="216" height="110" rx="8" fill="#ffffff" stroke="#2d78a7" stroke-width="2"/>
<text x="118.0" y="67.7" text-anchor="middle" font-size="22" fill="#1f2a36">Bank statement</text>
<text x="118.0" y="97.7" text-anchor="middle" font-size="22" fill="#1f2a36">balance</text>
<rect x="252" y="20" width="216" height="110" rx="8" fill="#ffffff" stroke="#2d78a7" stroke-width="2"/>
<text x="360.0" y="67.7" text-anchor="middle" font-size="22" fill="#1f2a36">Software bank</text>
<text x="360.0" y="97.7" text-anchor="middle" font-size="22" fill="#1f2a36">balance</text>
<rect x="494" y="20" width="216" height="110" rx="8" fill="#ffffff" stroke="#2d78a7" stroke-width="2"/>
<text x="602.0" y="67.7" text-anchor="middle" font-size="22" fill="#1f2a36">Sum of property</text>
<text x="602.0" y="97.7" text-anchor="middle" font-size="22" fill="#1f2a36">balances</text>
<rect x="210" y="240" width="300" height="90" rx="8" fill="#e8f1f7" stroke="#2d78a7" stroke-width="2"/>
<text x="360.0" y="294.1" text-anchor="middle" font-size="26" fill="#1f2a36">All three match</text>
<line x1="118" y1="132" x2="275.3" y2="236" stroke="#2d78a7" stroke-width="2" marker-end="url(#a)"/>
<line x1="360" y1="132" x2="360.0" y2="236" stroke="#2d78a7" stroke-width="2" marker-end="url(#a)"/>
<line x1="602" y1="132" x2="444.7" y2="236" stroke="#2d78a7" stroke-width="2" marker-end="url(#a)"/>
</svg>
