<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280">
  <title>Recruiting outreach results</title>
  <desc>On the day I recorded, the recruiter bot had contacted 116 people; 16 accepted and 12 replied.</desc>
  <rect x="0" y="0" width="720" height="280" fill="#ffffff"/>
  <text x="20" y="62" font-size="22" fill="#1f2a36">Contacted</text>
  <rect x="170" y="30" width="460" height="48" rx="8" fill="#2d78a7"/>
  <text x="646" y="64" font-size="24" fill="#1f2a36" font-weight="700">116</text>
  <text x="20" y="148" font-size="22" fill="#1f2a36">Accepted</text>
  <rect x="170" y="116" width="63" height="48" rx="8" fill="#2d78a7"/>
  <text x="249" y="150" font-size="24" fill="#1f2a36" font-weight="700">16</text>
  <text x="20" y="234" font-size="22" fill="#1f2a36">Replied</text>
  <rect x="170" y="202" width="48" height="48" rx="8" fill="#2d78a7"/>
  <text x="234" y="236" font-size="24" fill="#1f2a36" font-weight="700">12</text>
</svg>
