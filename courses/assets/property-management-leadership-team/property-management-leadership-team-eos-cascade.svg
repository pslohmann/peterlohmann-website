<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400">
  <title>EOS planning cascade</title>
  <desc>A 3-year vision feeds a 1-year plan, which feeds quarterly rocks, which the leadership team reviews in a weekly L10 meeting.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d78a7"/></marker></defs>
  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
  <rect x="20" y="16" width="330" height="64" rx="8" fill="#1f2a36" stroke="#1f2a36" stroke-width="2"/>
  <text x="185" y="56" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">3-year vision</text>
  <path d="M185,82 L185,114 L246,114" stroke="#2d78a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="250" y="96" width="330" height="64" rx="8" fill="#2d78a7" stroke="#2d78a7" stroke-width="2"/>
  <text x="415" y="136" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">1-year plan</text>
  <path d="M415,162 L415,214 L346,214" stroke="#2d78a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="20" y="196" width="330" height="64" rx="8" fill="#e8f1f7" stroke="#2d78a7" stroke-width="2"/>
  <text x="185" y="236" font-size="22" fill="#1f2a36" text-anchor="middle">Quarterly rocks</text>
  <path d="M185,262 L185,294 L246,294" stroke="#2d78a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="250" y="276" width="330" height="64" rx="8" fill="#e8f1f7" stroke="#2d78a7" stroke-width="2"/>
  <text x="415" y="316" font-size="22" fill="#1f2a36" text-anchor="middle">Weekly L10 meeting</text>
</svg>
