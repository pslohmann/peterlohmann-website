<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300">
  <title>Which fires I let burn</title>
  <desc>When a problem reaches me, I ask one question: safety, license, or fraud? If yes, I jump in. If not, I let the team handle it.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d78a7"/></marker></defs>
  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
  <rect x="190" y="16" width="340" height="64" rx="8" fill="#1f2a36" stroke="#1f2a36" stroke-width="2"/>
  <text x="360" y="56" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Safety, license, or fraud?</text>
  <path d="M270,82 L170,180" stroke="#2d78a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="196" y="124" font-size="20" fill="#6b7785" text-anchor="middle" font-weight="600">Yes</text>
  <path d="M450,82 L550,180" stroke="#2d78a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="524" y="124" font-size="20" fill="#6b7785" text-anchor="middle" font-weight="600">No</text>
  <rect x="20" y="186" width="300" height="64" rx="8" fill="#2d78a7" stroke="#2d78a7" stroke-width="2"/>
  <text x="170" y="226" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">I jump in</text>
  <rect x="400" y="186" width="300" height="64" rx="8" fill="#e8f1f7" stroke="#2d78a7" stroke-width="2"/>
  <text x="550" y="226" font-size="22" fill="#1f2a36" text-anchor="middle">Let the team handle it</text>
</svg>
