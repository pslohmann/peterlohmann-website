<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460">
  <title>How the wiki fills its own gaps</title>
  <desc>A question comes in. If the answer is already in Notion, answer with a link. If not, build the page together, and the gap is filled for good.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d78a7"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="460" fill="#ffffff"/>

  <rect x="210" y="16" width="300" height="64" rx="8" fill="#e8f1f7" stroke="#2d78a7" stroke-width="2"/>
  <text x="360" y="56" font-size="22" fill="#1f2a36" text-anchor="middle">Question comes in</text>
  <line x1="360" y1="82" x2="360" y2="122" stroke="#2d78a7" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="210" y="126" width="300" height="64" rx="8" fill="#1f2a36" stroke="#1f2a36" stroke-width="2"/>
  <text x="360" y="166" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Already in Notion?</text>

  <path d="M260,192 L170,250" stroke="#2d78a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="190" y="214" font-size="20" fill="#6b7785" text-anchor="middle" font-weight="600">Yes</text>
  <path d="M460,192 L550,250" stroke="#2d78a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="530" y="214" font-size="20" fill="#6b7785" text-anchor="middle" font-weight="600">No</text>

  <rect x="20" y="256" width="300" height="64" rx="8" fill="#2d78a7" stroke="#2d78a7" stroke-width="2"/>
  <text x="170" y="296" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Answer with a link</text>

  <rect x="400" y="256" width="300" height="64" rx="8" fill="#e8f1f7" stroke="#2d78a7" stroke-width="2"/>
  <text x="550" y="296" font-size="22" fill="#1f2a36" text-anchor="middle">Build the page together</text>
  <line x1="550" y1="322" x2="550" y2="362" stroke="#2d78a7" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="400" y="366" width="300" height="64" rx="8" fill="#2d78a7" stroke="#2d78a7" stroke-width="2"/>
  <text x="550" y="406" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Gap filled for good</text>
</svg>
