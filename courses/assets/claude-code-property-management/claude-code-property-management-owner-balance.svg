<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340">
  <title>Owner balance across properties</title>
  <desc>Property A at -$500 plus Property B at +$700 gives an owner total of $200, which is not a trust account violation.</desc>
  <rect x="0" y="0" width="720" height="340" fill="#ffffff"/>
  <rect x="20" y="20" width="320" height="110" rx="8" fill="#e8f1f7" stroke="#6b7785" stroke-width="2"/>
  <text x="180" y="62" font-size="22" fill="#1f2a36" text-anchor="middle">Property A</text>
  <text x="180" y="108" font-size="32" fill="#1f2a36" text-anchor="middle" font-weight="700">-$500</text>
  <text x="360" y="88" font-size="32" fill="#6b7785" text-anchor="middle" font-weight="700">+</text>
  <rect x="380" y="20" width="320" height="110" rx="8" fill="#e8f1f7" stroke="#6b7785" stroke-width="2"/>
  <text x="540" y="62" font-size="22" fill="#1f2a36" text-anchor="middle">Property B</text>
  <text x="540" y="108" font-size="32" fill="#2d78a7" text-anchor="middle" font-weight="700">+$700</text>
  <line x1="20" y1="160" x2="700" y2="160" stroke="#6b7785" stroke-width="2"/>
  <rect x="140" y="186" width="440" height="130" rx="8" fill="#2d78a7" stroke="#2d78a7" stroke-width="2"/>
  <text x="360" y="226" font-size="22" fill="#ffffff" text-anchor="middle">Owner total</text>
  <text x="360" y="268" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="700">$200</text>
  <text x="360" y="300" font-size="20" fill="#ffffff" text-anchor="middle">Not a trust account violation</text>
</svg>
