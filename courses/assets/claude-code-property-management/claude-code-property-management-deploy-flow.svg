<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420">
  <title>How the automations run</title>
  <desc>Claude Code on your computer pushes to GitHub, GitHub deploys to your VPS, scheduled cron jobs run there, and results go to Slack or email.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d78a7"/></marker></defs>
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>
  <rect x="160" y="12" width="400" height="60" rx="8" fill="#1f2a36" stroke="#1f2a36" stroke-width="2"/>
  <text x="360" y="49" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">Claude Code on your computer</text>
  <line x1="360" y1="74" x2="360" y2="94" stroke="#2d78a7" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="160" y="98" width="400" height="60" rx="8" fill="#e8f1f7" stroke="#2d78a7" stroke-width="2"/>
  <text x="360" y="135" font-size="22" fill="#1f2a36" text-anchor="middle">GitHub</text>
  <line x1="360" y1="160" x2="360" y2="180" stroke="#2d78a7" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="160" y="184" width="400" height="60" rx="8" fill="#e8f1f7" stroke="#2d78a7" stroke-width="2"/>
  <text x="360" y="221" font-size="22" fill="#1f2a36" text-anchor="middle">Your VPS</text>
  <line x1="360" y1="246" x2="360" y2="266" stroke="#2d78a7" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="160" y="270" width="400" height="60" rx="8" fill="#e8f1f7" stroke="#2d78a7" stroke-width="2"/>
  <text x="360" y="307" font-size="22" fill="#1f2a36" text-anchor="middle">Scheduled cron jobs</text>
  <line x1="360" y1="332" x2="360" y2="352" stroke="#2d78a7" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="160" y="356" width="400" height="60" rx="8" fill="#2d78a7" stroke="#2d78a7" stroke-width="2"/>
  <text x="360" y="393" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">Slack or email</text>
</svg>
