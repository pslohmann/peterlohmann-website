<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex">
<style>
  html,body{margin:0;width:1200px;height:675px;overflow:hidden;}
  body{background:radial-gradient(900px 560px at 50% 50%, #ffffff 0%, #f6f9fc 60%, #eef3f8 100%);}
  .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(31,42,54,.07) 1.2px, transparent 1.3px);background-size:28px 28px;}
  svg{position:absolute;inset:0;}
</style></head>
<body><div class="dots"></div>

    <path d="M600 338 Q 780 280 950 158"/>

    <path d="M600 338 Q 600 480 600 588"/>

    <circle cx="380" cy="334" r="5"/><circle cx="820" cy="334" r="5"/>

  <g transform="translate(926 134) scale(2)" stroke="#fff" stroke-width="1.9"><path d="M3 10.2 12 3l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></g>

  <!-- satellite: email -->
  <circle cx="250" cy="518" r="50" fill="#2C7CB0"/>

  <circle cx="950" cy="518" r="50" fill="#2C7CB0"/>

    <rect x="542" y="560" width="4" height="58" rx="2" fill="#7FB4DD"/>
    <rect x="558" y="576" width="74" height="8" rx="4" fill="#9fb6c6" fill-opacity=".7"/>
    <rect x="558" y="593" width="48" height="7" rx="3.5" fill="#9fb6c6" fill-opacity=".4"/>

    <rect x="102" y="309" width="116" height="58" rx="9" fill="#2a4a61" stroke="#4c6a80"/>
    <rect x="102" y="309" width="4" height="58" rx="2" fill="#7FB4DD"/>
    <rect x="118" y="325" width="74" height="8" rx="4" fill="#9fb6c6" fill-opacity=".7"/>
    <rect x="118" y="342" width="48" height="7" rx="3.5" fill="#9fb6c6" fill-opacity=".4"/>

  <circle cx="600" cy="338" r="235" fill="url(#glow)"/>
  <circle cx="600" cy="338" r="158" stroke="#E0703C" stroke-opacity=".26" stroke-width="2"/>
  <circle cx="600" cy="338" r="134" stroke="#E0703C" stroke-opacity=".42" stroke-width="2"/>

</body></html>
