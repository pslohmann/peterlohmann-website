<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex">
<style>

  .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(31,42,54,.07) 1.2px, transparent 1.3px);background-size:28px 28px;}
  svg{position:absolute;inset:0;}
