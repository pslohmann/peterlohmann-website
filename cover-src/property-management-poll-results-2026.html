<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://use.typekit.net/dik1zcl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=block">
<style>
html,body{margin:0;width:1200px;height:675px;overflow:hidden}
.c{box-sizing:border-box;width:1200px;height:675px;padding:92px 100px 96px;color:#fff;
  background:radial-gradient(120% 140% at 100% 0%,#2C7CB0 0%,#1F3A4D 55%);
  display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:auto 1fr;column-gap:64px}
.k{grid-column:1/-1;font:800 27px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#f3a57f}
.t{align-self:end}
.big{font-family:"bely-display",Georgia,serif;font-size:132px;line-height:1;letter-spacing:-.005em;white-space:nowrap}
.sub{margin-top:30px;font:600 33px/1.25 Inter,sans-serif;color:#dce7ef}
.bars{align-self:end;display:grid;gap:22px;padding-bottom:10px}
.bars i{display:block;height:34px;border-radius:999px;background:linear-gradient(90deg,#7FB4DD,#2C7CB0)}
.bars i:first-child{background:linear-gradient(90deg,#ec8a5a,#E0703C)}
</style></head><body><div class="c">
<div class="k">Poll results &middot; 2026</div>
<div class="t"><div class="big">21 polls.</div><div class="sub">What property managers<br>told me this year</div></div>
<div class="bars"><i style="width:92%"></i><i style="width:64%"></i><i style="width:41%"></i><i style="width:22%"></i></div>
</div></body></html>
